name: 1 Mainstream
description: '1 Mainstream was a cloud-based OTT (over-the-top) video streaming platform for content owners
  and distributors, enabling operators to launch live and on-demand video services across connected devices
  including iOS, Android, Roku, Amazon Fire TV, Chromecast, game consoles, smart TVs, and Apple TV, with
  DRM (Widevine, PlayReady), multi-CDN control, subscriber management, entitlements, and a CMS-based analytics
  engine. Backed by Sky and DCM Ventures, the company was acquired by Cisco in October 2015 and folded into
  Cisco''s Infinite Video suite of cloud-powered video entertainment solutions. The standalone 1mainstream.com
  domain no longer resolves; this profile is retained as a historical portfolio-lead record.'
